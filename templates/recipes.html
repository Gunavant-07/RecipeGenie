<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeGenie</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      .recipes-shell {
        max-width: 1180px;
        margin: 0 auto;
      }

      .recipes-hero {
        background:
          radial-gradient(circle at top left, rgba(255, 153, 51, 0.22), transparent 28%),
          radial-gradient(circle at bottom right, rgba(19, 136, 8, 0.16), transparent 26%),
          linear-gradient(135deg, #fffaf2 0%, #fffefb 54%, #eef7ef 100%);
        border-radius: 34px;
        padding: 2rem;
        box-shadow: 0 24px 60px rgba(22, 18, 12, 0.08);
        margin-bottom: 2rem;
      }

      .recipes-hero h2 {
        text-align: left;
        margin-bottom: 0.6rem;
      }

      .recipes-filter-panel {
        background: rgba(255,255,255,0.9);
        border-radius: 26px;
        padding: 1rem;
        margin-top: 1.4rem;
        border: 1px solid rgba(0,0,0,0.05);
      }

      .recipes-filter-grid {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) repeat(2, minmax(170px, 0.55fr)) auto auto;
        gap: 1rem;
        align-items: center;
      }

      .recipes-filter-grid input,
      .recipes-filter-grid select {
        width: 100%;
        padding: 0.85rem 1rem;
        border-radius: 18px;
        border: 1px solid #ead8c0;
        background: #fffefa;
        font: inherit;
      }

      .recipes-filter-grid label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #6f5a4a;
        font-weight: 500;
      }

      @media (max-width: 980px) {
        .recipes-filter-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 640px) {
        .recipes-filter-grid {
          grid-template-columns: 1fr;
        }
      }

      .recipes-section-title {
        text-align: left;
        margin-top: 2.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">RecipeGenie</div>
        <div class="hamburger">
          <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-menu">
          <li>
            <a href="{{ url_for('home') }}">Home</a>
          </li>
          <li>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
          </li>
          <li>
            <a href="{{ url_for('recipes_page') }}">Recipes</a>
          </li>
          <li>
            <a href="{{ url_for('generate_recipe_page') }}">Generate Recipe</a>
          </li>
          <li>
            <a href="{{ url_for('history_page') }}">History</a>
          </li>
          <li>
            <a href="{{ url_for('health_page') }}">Health Tracker</a>
          </li>
          <li class="login-link">
            <a href="{{ url_for('login_page') }}">Login</a>
          </li>
          <li class="register-link">
            <a href="{{ url_for('register_page') }}">Register</a>
          </li>
          <li class="logout-link" style="display:none;">
            <a href="{{ url_for('home') }}" id="logout">Logout</a>
          </li>
        </ul>
      </nav>
    </header>

    <section class="section">
      <div class="recipes-shell">
        <div class="recipes-hero">
          <h2>Explore Recipes</h2>
          <p>Browse recipe cards, filter by state or rating, and save favorites for the next cooking session.</p>

          <div class="recipes-filter-panel">
            <div class="recipes-filter-grid">
              <input type="text" id="search-input" placeholder="Search by recipe name..." />

              <select id="state-select" aria-label="Filter by state">
                <option value="All">All States</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Punjab">Punjab</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Kerala">Kerala</option>
                <option value="West Bengal">West Bengal</option>
              </select>

              <select id="cuisine-select" aria-label="Filter by cuisine">
                <option value="All">All Cuisines</option>
                <option value="Gujarati">Gujarati</option>
                <option value="Maharashtrian">Maharashtrian</option>
                <option value="Punjabi">Punjabi</option>
                <option value="South Indian">South Indian</option>
                <option value="North Indian">North Indian</option>
                <option value="Bengali">Bengali</option>
                <option value="Rajasthani">Rajasthani</option>
                <option value="Continental">Continental</option>
                <option value="Chinese">Chinese</option>
              </select>

              <label style="display: flex; align-items: center; gap: 0.5rem;"><input type="checkbox" id="high-rated" />High Rated Only (≥4.5)</label>

              <button id="apply-filter" class="btn primary">Apply</button>
            </div>
          </div>
        </div>

        <div class="recipe-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;"></div>

        <div id="loading" class="loading" style="display: none; text-align: center; padding: 3rem 0;">
          <div class="spinner"></div>
          <p>Loading more recipes...</p>
        </div>

        <div id="no-more" style="display: none; text-align: center; padding: 3rem 0; color: var(--gray);">
          <p>No more recipes to load.</p>
        </div>
      </div>
    </section>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
